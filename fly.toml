# Fly.io: `fly launch --no-deploy` once, `fly volumes create data --size 1`, set secrets, then `fly deploy`.
app = "royal-ramble"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  LLM_PROVIDER = "groq"
  LLM_MODEL = "qwen/qwen3.8-27b"
  MEMWAL_SERVER_URL = "https://relayer.memory.walrus.xyz"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
